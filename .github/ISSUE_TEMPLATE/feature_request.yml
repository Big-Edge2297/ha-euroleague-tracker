name: Feature request
description: Suggest an idea for the integration or the card
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it?
      description: A dashboard, an automation, something else?
