name: Dependency audit

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Libraries bundled into the card (fails on a known vulnerability)
        run: npm audit --omit=dev
      - name: Build and test tools (reported only, they are not part of the card)
        run: npm audit || true
