name: Screenshots

# Renders the card in every state and theme from the real-data fixtures and
# commits the PNGs in docs/images/, so the README always shows the current card.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/fixtures/**"
      - "custom_components/euroleague_tracker/parser.py"
      - "custom_components/euroleague_tracker/const.py"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      # Always start from the newest main (a re-run or a queued run would
      # otherwise render an older commit).
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci && npm run build
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/make_demo_states.py
      - run: python scripts/screenshots.py
      # Files uploaded while this ran would make the push fail; catch up first.
      - name: Catch up with main
        run: >-
          git -c user.name="github-actions[bot]"
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com"
          pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update card screenshots"
          file_pattern: "docs/images/*.png"
