<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EuroLeague Tracker card harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  body { margin: 0; font-family: Roboto, system-ui, sans-serif; }
  .shot { display: inline-block; padding: 16px; vertical-align: top; }
  .shot.dark { background: #111111; }
  .shot.light { background: #F3F4F6; }
  .shot.team { background: #F3F4F6; }
  .frame { width: 400px; }
</style>
<script>
  // Minimal stand-in for Home Assistant's <ha-card>.
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() {
      this.style.display = "block";
      this.style.borderRadius = "12px";
      this.style.boxShadow = "0 1px 3px rgba(0,0,0,.25)";
    }
  });
</script>
<script type="module" src="../../custom_components/euroleague_tracker/frontend/euroleague-tracker-card.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module">
  const demo = await fetch("./demo-states.json").then((r) => r.json());
  await customElements.whenDefined("euroleague-tracker-card");

  const ids = {
    game: "sensor.olympiacos_piraeus_euroleague_game",
    standings: "sensor.olympiacos_piraeus_euroleague_standings_position",
    stats: "sensor.olympiacos_piraeus_euroleague_season_stats",
  };
  const hassFor = (gameKey, standingsKey = "standings") => ({
    language: "en",
    locale: { language: "en-GB", time_format: "24", time_zone: "server" },
    config: { time_zone: "Asia/Nicosia" },
    states: {
      [ids.game]: { entity_id: ids.game, ...demo[gameKey] },
      [ids.standings]: { entity_id: ids.standings, ...demo[standingsKey] },
      [ids.stats]: { entity_id: ids.stats, ...demo.stats },
    },
  });

  // name, game state, view, extra config
  const shots = [
    ["next-game", "pre", "game"],
    ["live", "live", "game"],
    ["final", "final", "game"],
    ["standings", "final", "standings"],
    ["stats", "final", "stats"],
    ["stats-players", "final", "stats", { statsTab: "players" }],
    ["stats-shots", "final", "stats", { statsTab: "shots" }],
    ["round", "final", "round"],
    ["bracket", "po_final", "standings", { standings: "standings_post" }],
    ["playoff-game", "po_final", "game", { standings: "standings_post" }],
    ["final-four", "ff_pre", "game", { standings: "standings_post" }],
    ["compact", "pre", "compact", { compact: ["pre", "live", "final", "po_final"] }],
    ["tabs", "live", "tabs"],
  ];
  const themes = ["dark", "light", "team"];
  const root = document.getElementById("root");
  for (const theme of themes) {
    for (const [name, gameKey, view, extra = {}] of shots) {
      const wrap = document.createElement("div");
      wrap.className = `shot ${theme}`;
      wrap.id = `${name}-${theme}`;
      const frame = document.createElement("div");
      frame.className = "frame";
      for (const key of extra.compact ?? [gameKey]) {
        const tag = view === "compact" ? "euroleague-tracker-compact-card" : "euroleague-tracker-card";
        const card = document.createElement(tag);
        card.setConfig({ type: `custom:${tag}`, entity: ids.game, view, theme, play_by_play_rows: 4 });
        card.hass = hassFor(key, extra.standings);
        if (extra.statsTab) card._statsTab = extra.statsTab;
        if (view === "compact") card.style.cssText = "display:block;margin-bottom:8px";
        frame.appendChild(card);
      }
      wrap.appendChild(frame);
      root.appendChild(wrap);
    }
  }
  // Let crest images settle (or fail over to the code badge).
  await new Promise((r) => setTimeout(r, 1500));
  document.body.dataset.ready = "1";
</script>
</body>
</html>
